# ── Server ──────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Datasource ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:portfolio_db}?serverTimezone=UTC&sslMode=REQUIRED
spring.datasource.username=${DB_USER:portfolio_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Flyway ──────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── Multipart uploads (images: 5 MB) ───────────
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:5MB}
spring.servlet.multipart.enabled=true
app.media.storage-dir=${PORTFOLIO_MEDIA_DIR:./portfolio-media}

# ── JWT ─────────────────────────────────────────────────────
# Provide a Base64-encoded 256-bit secret via environment variable.
# Generate one with: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET:CHANGE_ME_generate_a_secure_256bit_base64_secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS ────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Contact rate-limit (requests per IP per hour) ───────────
app.contact.rate-limit=${CONTACT_RATE_LIMIT:5}

# ── Jackson ─────────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
# ── Email (optional) ──────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
mail.from=${MAIL_FROM:hello@example.com}
mail.to=${MAIL_TO:admin@example.com}
