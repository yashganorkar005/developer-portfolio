# ── Test profile — uses H2 in-memory, no MySQL needed ───────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway in tests (schema created by Hibernate ddl-auto)
spring.flyway.enabled=false

app.jwt.secret=dGVzdFNlY3JldEtleUZvclVuaXRUZXN0aW5nT25seUNoYW5nZU1lMTIzNDU2
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5173
app.contact.rate-limit=100
